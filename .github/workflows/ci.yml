name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - name: Test cold and warm plugin bootstrap
        shell: python
        env:
          HEXAHARNESS_CACHE_DIR: ${{ runner.temp }}/hexaharness-bootstrap
        run: |
          import pathlib, subprocess, sys, tomllib
          expected = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"]
          for phase in ("cold", "warm"):
              result = subprocess.run(
                  [sys.executable, "-I", "skills/hexaharness/scripts/hexa.py", "version"],
                  check=True, capture_output=True, text=True,
              )
              assert result.stdout.strip() == expected, (phase, result.stdout, result.stderr)
              print(f"{phase}: {result.stdout.strip()}")
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy src skills/hexaharness/scripts/hexa.py
      - run: uv run pytest --cov --cov-report=term-missing
      - run: uv build
