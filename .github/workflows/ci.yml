name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
      COVERAGE_FILE: .coverage.${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - name: Test cold and warm plugin bootstrap
        shell: python
        env:
          HEXAHARNESS_CACHE_DIR: ${{ runner.temp }}/hexaharness-bootstrap
        run: |
          import pathlib, subprocess, sys, tomllib
          expected = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"]
          for phase in ("cold", "warm"):
              result = subprocess.run(
                  [sys.executable, "-I", "skills/hexaharness/scripts/hexa.py", "version"],
                  check=True, capture_output=True, text=True,
              )
              assert result.stdout.strip() == expected, (phase, result.stdout, result.stderr)
              print(f"{phase}: {result.stdout.strip()}")
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy src skills/hexaharness/scripts/hexa.py
      - run: uv run pytest --cov --cov-report=term-missing --cov-fail-under=0
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}
          path: .coverage.*
          include-hidden-files: true
          if-no-files-found: error
      - run: uv build
      - name: Verify fresh wheel in a space and Unicode path
        shell: python
        run: |
          import hashlib, os, pathlib, subprocess, sys, tomllib, venv
          checkout = pathlib.Path.cwd()
          expected = tomllib.loads((checkout / "pyproject.toml").read_text())["project"]["version"]
          destination = pathlib.Path(os.environ["RUNNER_TEMP"]) / "wheel smoke 한글"
          venv.EnvBuilder(with_pip=True, symlinks=os.name != "nt").create(destination)
          python = destination / ("Scripts/python.exe" if os.name == "nt" else "bin/python")
          subprocess.run([str(python), "-I", "-m", "pip", "install", "--require-hashes",
                          "-r", str(checkout / "runtime-requirements.txt")], check=True)
          wheel = checkout / "dist" / f"hexaharness-{expected}-py3-none-any.whl"
          subprocess.run([str(python), "-I", "-m", "pip", "install", "--no-deps", str(wheel)], check=True)
          result = subprocess.run([str(python), "-I", str(checkout / "tests/wheel_install_probe.py"),
                                   expected], cwd=destination, check=True, capture_output=True, text=True)
          print(result.stdout)
          (checkout / "dist" / "wheel-install-evidence.json").write_text(result.stdout, encoding="utf-8")
          lines = [f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}\n"
                   for p in sorted((checkout / "dist").iterdir()) if p.suffix in (".whl", ".gz")]
          (checkout / "dist" / "SHA256SUMS").write_text("".join(lines), encoding="utf-8")
      - uses: actions/upload-artifact@v4
        with:
          name: distribution-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error

  coverage:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          merge-multiple: true
      # Unsupported POSIX transactions stay skipped on Windows. Enforce the
      # unchanged global threshold on actual coverage from all three platforms.
      - run: uv run coverage combine
      - run: uv run coverage report --fail-under=85
