name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
      COVERAGE_FILE: .coverage.${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - name: Test cold and warm plugin bootstrap
        shell: python
        env:
          HEXAHARNESS_CACHE_DIR: ${{ runner.temp }}/hexaharness-bootstrap
        run: |
          import pathlib, subprocess, sys, tomllib
          expected = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"]
          for phase in ("cold", "warm"):
              result = subprocess.run(
                  [sys.executable, "-I", "skills/hexaharness/scripts/hexa.py", "version"],
                  check=True, capture_output=True, text=True,
              )
              assert result.stdout.strip() == expected, (phase, result.stdout, result.stderr)
              print(f"{phase}: {result.stdout.strip()}")
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy src skills/hexaharness/scripts/hexa.py
      - run: uv run pytest --cov --cov-report=term-missing --cov-fail-under=0
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}
          path: .coverage.*
          include-hidden-files: true
          if-no-files-found: error
      - run: uv build

  coverage:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          merge-multiple: true
      # Unsupported POSIX transactions stay skipped on Windows. Enforce the
      # unchanged global threshold on actual coverage from all three platforms.
      - run: uv run coverage combine
      - run: uv run coverage report --fail-under=85
