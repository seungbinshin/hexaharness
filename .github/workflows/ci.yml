name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - name: Test cold and warm plugin bootstrap
        env:
          HEXAHARNESS_CACHE_DIR: ${{ runner.temp }}/hexaharness-bootstrap
        run: |
          python3 -I skills/hexaharness/scripts/hexa.py version
          python3 -I skills/hexaharness/scripts/hexa.py version
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy src skills/hexaharness/scripts/hexa.py
      - run: uv run pytest --cov --cov-report=term-missing
      - run: uv build
