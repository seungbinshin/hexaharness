[project]
name = "hexaharness"
version = "0.1.0"
description = "A host-neutral, six-layer production harness for agent-driven work."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "HexaHarness contributors" }]
keywords = [
  "agent-harness",
  "agent-skills",
  "cli",
  "codex",
  "claude-code",
  "observability",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "pydantic>=2.10,<3",
  "pyyaml>=6,<7",
  "typer>=0.16,<1",
]

[project.scripts]
hexa = "hexaharness.cli:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
  "mypy>=1.15,<2",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.11,<1",
  "types-pyyaml>=6.0.12",
]

[tool.uv]
default-groups = ["dev"]

[tool.hatch.build.targets.wheel]
packages = ["src/hexaharness"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "DTZ", "PTH", "RUF"]
ignore = ["A005"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
pretty = true

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["hexaharness"]

[tool.coverage.report]
fail_under = 85
show_missing = true
