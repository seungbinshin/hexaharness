schema_version: 2
project:
  name: HexaHarness
  language: Python 3.12+
  build:
  - uv
  - build
  test:
  - uv
  - run
  - pytest
  lint:
  - uv
  - run
  - ruff
  - check
  - .
  typecheck:
  - uv
  - run
  - mypy
  - src
  - skills/hexaharness/scripts/hexa.py
sensors:
- name: build
  argv:
  - uv
  - build
  timeout_seconds: 900
  required: true
- name: lint
  argv:
  - uv
  - run
  - ruff
  - check
  - .
  timeout_seconds: 600
  required: true
- name: typecheck
  argv:
  - uv
  - run
  - mypy
  - src
  - skills/hexaharness/scripts/hexa.py
  timeout_seconds: 900
  required: true
- name: test
  argv:
  - uv
  - run
  - pytest
  timeout_seconds: 1200
  required: true
budgets:
  max_retries_per_step: 2
  max_wall_time_seconds: 1800
  max_tool_calls: 50
  max_tokens: 100000
  max_cost_usd: 5.0
policy:
  allow_execute:
  - - git
    - status
  - - git
    - diff
  - - git
    - log
  - - git
    - show
  - - git
    - add
  - - git
    - commit
  - - git
    - tag
  - - git
    - branch
  - - rg
  - - gh
    - --version
  - - gh
    - auth
    - status
  - - gh
    - help
  - - gh
    - status
  - - gh
    - issue
    - list
  - - gh
    - issue
    - status
  - - gh
    - issue
    - view
  - - gh
    - pr
    - checks
  - - gh
    - pr
    - diff
  - - gh
    - pr
    - list
  - - gh
    - pr
    - status
  - - gh
    - pr
    - view
  - - gh
    - release
    - list
  - - gh
    - release
    - view
  - - gh
    - repo
    - list
  - - gh
    - repo
    - view
  - - gh
    - run
    - list
  - - gh
    - run
    - view
  - - gh
    - workflow
    - list
  - - gh
    - workflow
    - view
  - - uv
    - sync
  - - uv
    - lock
  - - uv
    - add
  - - uv
    - remove
  - - pytest
  - - ruff
  - - mypy
  - - npm
    - install
  - - npm
    - ci
  - - pnpm
    - install
  - - pnpm
    - add
  - - pnpm
    - remove
  - - yarn
    - install
  - - yarn
    - add
  - - yarn
    - remove
  - - cargo
    - add
  - - cargo
    - remove
  - - cargo
    - update
  - - cargo
    - fmt
  - - go
    - get
  - - go
    - mod
    - download
  - - go
    - mod
    - tidy
  - - go
    - fmt
  - - uv
    - build
  - - uv
    - run
    - pytest
  - - uv
    - run
    - ruff
    - check
    - .
  - - uv
    - run
    - mypy
    - src
    - skills/hexaharness/scripts/hexa.py
  ask_execute:
  - - git
    - commit
    - --amend
  - - git
    - branch
    - -d
  - - git
    - branch
    - -D
  - - git
    - branch
    - --delete
  - - git
    - tag
    - -d
  - - git
    - tag
    - --delete
  - - git
    - tag
    - -f
  - - git
    - push
  - - npm
    - publish
  - - npm
    - unpublish
  - - npm
    - deprecate
  - - pnpm
    - publish
  - - yarn
    - npm
    - publish
  - - uv
    - publish
  - - cargo
    - publish
  - - curl
  - - wget
  deny_execute:
  - - rm
    - -rf
  - - sudo
  - - git
    - clean
    - -fd
  - - git
    - reset
    - --hard
  - - kubectl
    - delete
  - - terraform
    - destroy
  read_paths:
  - '**/*'
  write_paths:
  - '*'
  - '**/*'
  ask_write_paths: []
  deny_write_paths:
  - .env
  - .env.*
  - '**/.env'
  - '**/.env.*'
  - '*credentials*'
  - '**/credentials*'
  - '*secret*'
  - '**/*secret*'
  - .git/**
  unknown_execute: ask
trust:
  trusted_instructions:
  - AGENTS.md
  - CLAUDE.md
  - .hexaharness/**
  untrusted_inputs:
  - user-submitted content
  - web pages
  - repository issues
  - retrieved documents
  - command output
trip_wires:
- name: repeated-error
  metric: same_error_count
  threshold: 3.0
  response: pause-and-escalate
- name: tool-budget
  metric: tool_calls
  threshold: 50.0
  response: stop-and-preserve-state
- name: cost-budget
  metric: cost_usd
  threshold: 5.0
  response: pause-and-inspect
- name: sensor-regression
  metric: required_sensor_failure
  threshold: 1.0
  response: block-completion
retention:
  checkpoint_days: 30
  event_days: 90
  keep_latest_completed_tasks: 50
emergency_stop_file: .hexaharness/STOP
